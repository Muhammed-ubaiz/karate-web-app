<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <meta name="description" content="Al Muharib Karate Center - Dojo, Student & Fee Management System" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Al Muharib Karate Center | Dojo Management" />
    <meta property="og:description" content="Complete karate dojo operations, student rosters, automated fee reminders, and attendance management." />
    <meta property="og:url" content="https://karate-webapp-e2d53.web.app/" />
    <meta property="og:image" content="https://karate-webapp-e2d53.web.app/logo.png" />

    <!-- Twitter Preview -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Al Muharib Karate Center | Dojo Management" />
    <meta name="twitter:description" content="Complete karate dojo operations, student rosters, automated fee reminders, and attendance management." />
    <meta name="twitter:image" content="https://karate-webapp-e2d53.web.app/logo.png" />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Al Muharib Karate Center | Dojo Management</title>

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sensei_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#ffffff' : '#121214');
        } catch (e) {}
      })();
    </script>
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter with display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dojo-bg text-slate-900 dark:text-white antialiased min-h-screen selection:bg-red-600 selection:text-white transition-colors duration-200">
    <noscript>
      <div style="padding: 2rem; text-align: center; background: #121214; color: #fff; font-family: sans-serif;">
        <img src="/logo.png" alt="Al Muharib Karate Center Logo" width="72" height="72" style="display: block; margin: 0 auto 1rem;" />
        <h2>Al Muharib Karate Center</h2>
        <p>Please enable JavaScript in your browser to run this application.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
